                if(banner.style.backgroundColor == "chartreuse"){
                    banner.style.backgroundColor = "aqua";
                }else{
                    banner.style.backgroundColor = "chartreuse";
                }
            }, 250);
        }
        bannerChange();
        function FedRedirect(){

}
GamesRedirect.call(document.getElementById("Games"));
